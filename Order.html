<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Crust Bakery - Place Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #1a1410;
      color: #FFFDF9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .order-card {
      background: linear-gradient(#D3AC8A, #9C6340, #5D3E2F);
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-top: 30px;
    }
    .card-title {
      color: #2B1E16;
      font-weight: 700;
    }
    .form-label {
      color: #2B1E16;
      font-weight: 600;
    }
    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid #9C6340;
    }
    .btn-gold {
      background-color: #2B1E16;
      color: #FFFDF9;
      border: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .btn-gold:hover {
      background-color: #1a1410;
      color: #FFFDF9;
    }
  </style>
</head>
<body>
    <!-- nav -->
     <nav class="navbar navbar-expand-lg navbar-dark sticky-top bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
        <img src="hamburger.svg"></img>
        Gold.Crust.Bakery</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="About us.html">About Us</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="Products.html">Products</a>
            </li>

            <!-- Dropdown -->
            <div class="nav-item dropdown">
  <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
    More
  </button>
  <ul class=" dropdown-menu">
    <li><a class="dropdown-item" href="Faq.html">FAQ</a></li>
    <li><a class="dropdown-item" href="About us.html">Background</a></li>
    <li><a class="dropdown-item" href="Order.html">Place order</a></li>
  </ul>
</div>


            <!-- dropdown -->
            <li class="nav-item">
              <a class="nav-link" href="ContactUs.html" >Contact Us</a>
            </li>

            <li class="nav-item">
              <a class="nav-link " href="signUp.html" >Sign Up</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- nav -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card order-card p-4 p-md-5">
          <h2 class="card-title text-center mb-4">Place Your Bakery Order</h2>
          <form>
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="email" class="form-control" id="fullName" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-3">
              <label for="bakeryItem" class="form-label">Select Item</label>
              <select class="form-select" id="bakeryItem" required>
                <option value="" selected disabled>Choose a treat...</option>
                <option value="glazed-donuts">Glazed Chocolate Donuts</option>
                <option value="artisan-bread">Artisan Sourdough</option>
                <option value="pastry-box">Assorted Pastry Box</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="quantity" class="form-label">Quantity</label>
              <input type="number" class="form-control" id="quantity" min="1" value="1" required>
            </div>
            <div class="mb-4">
              <label for="notes" class="form-label">Special Instructions</label>
              <textarea class="form-control" id="notes" rows="3" placeholder="Dietary restrictions or pickup timing..."></textarea>
            </div>
            <button type="submit" class="btn btn-gold w-100">Submit Order</button>
          </form>
        </div>
      </div>
    </div>
  </div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js" 
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" 
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
// collapse nav bar when its a hamburger menu on scroll
       window.addEventListener('scroll', function() {
        console.log('scrolled');
        const navbarCollapse = document.querySelector('#mainNavbar');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
          const bsCollapse = bootstrap.Collapse.getOrCreateInstance(navbarCollapse);
          bsCollapse.hide();
        }
       });
    </script>
</body>
</html>
